name: Build Ruby with YJIT and Upload miniruby

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest-large

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install openssl readline libyaml autoconf automake bison libffi

      - name: Install Rust (required for YJIT)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Clone Ruby with YJIT
        run: |
          git clone https://github.com/ruby/ruby yjit

      - name: Configure Ruby with YJIT
        run: |
          cd yjit
          ./autogen.sh
          ./configure --enable-yjit=dev \
                      --prefix=$HOME/.rubies/ruby-yjit \
                      --disable-install-doc \
                      --with-opt-dir="$(brew --prefix openssl):$(brew --prefix readline):$(brew --prefix libyaml)"

      - name: Build and Install Ruby
        run: |
          cd yjit
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Rename miniruby binary
        run: |
          mkdir -p output
          cp yjit/miniruby output/ruby_macos_x86_64

      - name: Upload miniruby as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruby_macos_x86_64
          path: output/ruby_macos_x86_64
