name: Build Ruby with YJIT and Copy miniruby

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install openssl readline libyaml autoconf automake bison libffi

      - name: Install Rust (required for YJIT)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Clone Ruby with YJIT
        run: |
          git clone https://github.com/ruby/ruby yjit

      - name: Configure Ruby with YJIT
        run: |
          cd yjit
          ./autogen.sh
          ./configure --enable-yjit=dev \
                      --prefix=$HOME/.rubies/ruby-yjit \
                      --disable-install-doc \
                      --with-opt-dir="$(brew --prefix openssl):$(brew --prefix readline):$(brew --prefix libyaml)"

      - name: Build and Install Ruby
        run: |
          cd yjit
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Copy miniruby into repo as ruby_macos_x86_64
        run: |
          mkdir -p "$GITHUB_WORKSPACE/src"
          cp yjit/miniruby "$GITHUB_WORKSPACE/src/ruby_macos_x86_64"

      - name: Commit and push to repo
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/ruby_macos_x86_64
          git commit -m "Add macOS miniruby build as ruby_macos_x86_64"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
